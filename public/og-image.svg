    <ellipse cx="60" cy="50" rx="30" ry="25" fill="#D4AF37"/>
    <circle cx="45" cy="45" r="5" fill="#0A0E1A"/>
    <circle cx="75" cy="45" r="5" fill="#0A0E1A"/>
    <path d="M35 65 Q60 80 85 65" stroke="#0A0E1A" stroke-width="3" fill="none"/>
    <line x1="25" y1="20" x2="15" y2="0" stroke="url(#goldGradient)" stroke-width="4" stroke-linecap="round"/>
    <line x1="95" y1="20" x2="105" y2="0" stroke="url(#goldGradient)" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Main Title -->
